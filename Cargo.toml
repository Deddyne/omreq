[workspace]
members = ["crates/omreq-core", "crates/omreq-napi", "crates/omreq-h3-fixture"]
resolver = "3"
exclude = [
    "vendor/wreq",
    "vendor/http2",
    "vendor/wreq-proto",
    "vendor/quic",
    "vendor/quic-proto",
    "vendor/http3",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.100"

[workspace.dependencies]
wreq = { version = "=0.16.4", default-features = false, features = ["tokio-rt", "webpki-roots", "stream", "socks"] }
napi = { version = "=3.16.2", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "=3.7.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.3", features = ["sync", "time", "macros", "rt-multi-thread"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
bytes = "=1.12.1"
http = "=1.5.0"
http-body = "=1.1.0"
url = "=2.5.8"
futures-util = "=0.3.34"
sha2 = "=0.10.9"
jsonschema = { version = "=0.61.2", default-features = false }
psl = "=2.1.254"
quic = { version = "=0.12.2", default-features = false, features = ["btls", "runtime-tokio"] }
quic-proto = { version = "=0.12.2", default-features = false, features = ["btls"] }
http3 = { version = "=0.2.0", default-features = false, features = ["unstable"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Transport qualification: stable wreq with a minimal upstream TLS DTO backport.
[patch.crates-io]
http2 = { path = "vendor/http2" }
wreq-proto = { path = "vendor/wreq-proto" }
wreq = { path = "vendor/wreq" }
quic = { path = "vendor/quic" }
quic-proto = { path = "vendor/quic-proto" }
http3 = { path = "vendor/http3" }
btls = { git = "https://github.com/0x676e67/btls", rev = "3c1dd080ba617d78c63cd09285d2ce31abcdcbf9" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "3c1dd080ba617d78c63cd09285d2ce31abcdcbf9" }
